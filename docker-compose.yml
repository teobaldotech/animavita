version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development

    container_name: animavita_backend

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - ./apps/backend:/app
      - /app/node_modules

    depends_on:
      mongodb:
        condition: service_healthy
      localstack:
        condition: service_started

    command: pnpm run start:dev

  mongodb:
    container_name: animavita_mongo

    image: mongo:7.0

    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
      MONGO_INITDB_DATABASE: animavita

    volumes:
      - mongo:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "mongodb://mongo:mongo@localhost:27017/admin?authSource=admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  localstack:
    container_name: animavita_localstack

    image: localstack/localstack:3.0

    restart: unless-stopped

    ports:
      - "4566:4566"

    environment:
      SERVICES: s3
      DEBUG: 1
      PERSISTENCE: 1
      AWS_DEFAULT_REGION: us-east-1

    volumes:
      - localstack-data:/var/lib/localstack
      - ./apps/backend/scripts/localstack-init.sh:/etc/localstack/init/ready.d/init-aws.sh

volumes:
  mongo:
    driver: local

  localstack-data:
    driver: local
